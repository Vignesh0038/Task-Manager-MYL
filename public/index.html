<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Task Manager</title>
<style>
:root{--p:#4F46E5;--bg:#F3F4F6;--mut:#6B7280}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#111827}
.top{background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;position:sticky;top:0;z-index:5}
.top .grow{flex:1}.top .who{font-size:12px;text-align:right}
.top button{background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer}
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 48px)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e7eb;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:#fff;padding:8px 2px;font-size:11px;color:var(--mut);cursor:pointer}
.nav button .ic{display:block;font-size:20px}
.nav button.on{color:var(--p);font-weight:700}
.main{padding:14px 14px 90px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
@media(min-width:800px){
 .shell{grid-template-columns:100px 1fr}
 .nav{position:static;flex-direction:column;border-top:0;border-right:1px solid #e5e7eb;padding-top:10px}
 .nav button{flex:none;padding:14px 4px}
 .main{padding-bottom:30px}
}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:8px}
.card.click{cursor:pointer;transition:transform .1s,box-shadow .1s}.card.click:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}.card.click:active{transform:scale(.99)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}
.grow{flex:1}
h2{margin:0;font-size:22px}h3{margin:6px 0 0;font-size:18px}
.title{font-weight:700;font-size:16px}
.muted{color:var(--mut)}.sm{font-size:12px}
.badge{color:#fff;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:700;display:inline-block}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--p)}
textarea{min-height:80px;resize:vertical}
.f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
.f label{font-size:12px;color:var(--mut)}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.o{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn.g{background:#0D9488}.btn.r{background:#DC2626}.btn.s{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5}
.tiles{display:flex;gap:10px;justify-content:space-around}
.tile{text-align:center;flex:1}.tile b{font-size:22px;display:block}
.bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.warn{background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B;border-radius:12px;padding:10px 14px;font-size:14px}
.auth{max-width:400px;margin:40px auto;padding:0 14px}
.auth .card{align-items:stretch;padding:22px}
.center{text-align:center}
.hist{font-size:12px;color:var(--mut)}
button.lnk{background:none;border:0;color:var(--p);cursor:pointer;font:inherit;padding:4px}
.plist{display:flex;flex-direction:column;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.plist:empty{display:none}
.pitem{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #f3f4f6;background:#fff}
.pitem:last-child{border-bottom:0}.pitem:hover{background:#eef2ff}
.chip{display:inline-flex;gap:6px;align-items:center;background:#eef2ff;color:#3730a3;border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid #d1d5db;background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.quick button:hover{background:#f3f4f6}
#upd{position:fixed;top:0;left:0;right:0;z-index:50}
#upd .ub{background:#111827;color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
#upd .ub .btn{padding:6px 14px}
#upd.force{inset:0;background:rgba(17,24,39,.92);display:flex;align-items:center;justify-content:center;padding:20px}
#upd.force .ub{flex-direction:column;border-radius:16px;padding:26px;max-width:340px;text-align:center;background:#fff;color:#111827}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
.top .av{background:#fff;color:var(--p);border-radius:50%;width:34px;height:34px;font-size:16px;font-weight:700}
.dlg{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg .db{background:#fff;border-radius:16px;padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:16px}
.nbadge{position:absolute;top:-4px;right:-6px;background:#ef4444;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-weight:700;display:none}
#np{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;z-index:40;box-shadow:-4px 0 20px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#np .nh{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid #e5e7eb}
#np .nl{overflow:auto;flex:1}
.ni{padding:12px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ni.un{background:#eef2ff;border-left:4px solid var(--p)}
</style>
</head>
<body>
<div id="upd"></div>
<div id="app"><div class="auth center muted">Loading…</div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword,
         sendPasswordResetEmail, updatePassword, EmailAuthProvider, reauthenticateWithCredential }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc,
         getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot,
         arrayUnion, increment, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import { firebaseConfig, ADMIN_EMAIL } from "./config.js";
import { VAPID_KEY } from "./push-config.js";

const APP_VERSION = "2.3.1";   // release.js changes this line automatically
const LIMITS = { reads: 50000, writes: 20000, deletes: 20000 };   // Firebase Spark daily limits
const WARN = 0.7;
const STATUSES = ["Pending", "In Progress", "On Hold", "Rework", "Completed", "Rejected"];
const PRIORITIES = ["Low", "Medium", "High"];
const S_COL = { "Pending": "#F59E0B", "In Progress": "#2563EB", "On Hold": "#6B7280", "Rework": "#7C3AED",
                "Completed": "#16A34A", "Rejected": "#DC2626" };
const P_COL = { Low: "#16A34A", Medium: "#F59E0B", High: "#DC2626" };
const R_COL = { admin: "#4F46E5", manager: "#0D9488", user: "#6B7280" };
const ROLES = ["user", "manager", "admin"];
const MIN_PW = 6;                       // Firebase minimum
const ALIAS = "@tm.local";              // 4-digit User ID 1001 logs in as 1001@tm.local behind the scenes
const DONE = ["Completed", "Rejected"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const secAuth = getAuth(initializeApp(firebaseConfig, "secondary"));   // used only to create users
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowIso = () => new Date().toISOString();
const todayStr = () => new Date().toLocaleDateString("en-CA");
const fmt = iso => { if (!iso) return "-"; const d = new Date(iso); const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const pacificDay = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date());
let toastT;
function toast(m, ms = 3800) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
const errMsg = e => ({ "auth/email-already-in-use": "This User ID / email already exists", "auth/invalid-email": "Invalid ID or email",
  "auth/weak-password": `Password must be at least ${MIN_PW} characters`, "auth/wrong-password": "Wrong password",
  "auth/invalid-credential": "Wrong User ID or password", "auth/too-many-requests": "Too many attempts - try later",
  "permission-denied": "Not allowed" }[e.code] || e.message || String(e));

/* ---------- Firestore usage counter ---------- */
const UC = { r: 0, w: 0, d: 0 };
const track = (k, n = 1) => { UC[k] += n; };
async function flushUsage() {
  if (!S.me || !(UC.r + UC.w + UC.d)) return;
  const s = { ...UC }; UC.r = UC.w = UC.d = 0;
  try { await setDoc(doc(db, "usage", pacificDay()), { reads: increment(s.r), writes: increment(s.w + 1), deletes: increment(s.d) }, { merge: true }); }
  catch (e) { UC.r += s.r; UC.w += s.w; UC.d += s.d; }
}
setInterval(flushUsage, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushUsage(); });

const rd = async q => { const s = await getDocs(q); track("r", Math.max(1, s.size)); return s; };
const rdoc = async r => { const s = await getDoc(r); track("r"); return s; };
async function wr(fn, n = 1) {
  try { track("w", n); const r = await fn(); return r ?? true; }
  catch (e) { console.error(e); toast("Failed: " + errMsg(e)); return false; }
}

/* ---------- in-page dialog (the native confirm() does not work inside the APK) ---------- */
function ask(msg, okLabel = "Yes", cancel = true) {
  return new Promise(res => {
    const d = document.createElement("div"); d.className = "dlg";
    d.innerHTML = `<div class="db"><div style="white-space:pre-line">${esc(msg)}</div><div class="row" style="justify-content:flex-end">${cancel ? '<button class="btn o" data-k="0">Cancel</button>' : ""}<button class="btn" data-k="1">${esc(okLabel)}</button></div></div>`;
    d.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) { d.remove(); res(b.dataset.k === "1"); } });
    document.body.appendChild(d);
  });
}

/* ---------- push notifications (installed web app, works when the app is closed) ---------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => { });
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.taskId && S.me) openTask(e.data.taskId); });
}
const pushOK = () => "serviceWorker" in navigator && "PushManager" in window && typeof Notification !== "undefined";
const keyOK = () => VAPID_KEY && !VAPID_KEY.startsWith("PASTE");
async function registerPush(askPermission) {
  if (!pushOK()) throw new Error("This window cannot receive push. Install the app from Chrome or Edge.");
  if (!keyOK()) throw new Error("Web Push key missing in push-config.js");
  if (Notification.permission !== "granted") {
    if (!askPermission) return false;
    if ((await Notification.requestPermission()) !== "granted") throw new Error("Notifications are blocked. Allow them in the browser / app settings.");
  }
  const reg = await navigator.serviceWorker.ready;
  const tok = await getToken(getMessaging(app), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
  if (!tok) throw new Error("Could not get a push token");
  await setDoc(doc(db, "devices", tok), { uid: S.me.id, ua: navigator.userAgent.slice(0, 120), updated: nowIso() });
  track("w"); lsSet("tm_tok", tok);
  return true;
}
function pushCard() {
  let st, btn = "";
  if (!pushOK()) st = "This window (APK / EXE) cannot receive push when closed. To get push: open the website in <b>Chrome (Android)</b> or <b>Edge / Chrome (PC)</b> and choose <b>Install app / Add to Home screen</b>, then log in there and press the button below.";
  else if (Notification.permission === "denied") st = "Notifications are blocked for this app. Allow them in the browser / phone settings, then reload.";
  else if (Notification.permission === "granted" && lsGet("tm_tok", null)) st = "✅ Push is ON for this device. You will be alerted even when the app is closed (it can take a few minutes).";
  else { st = "Get alerts for new tasks and completed tasks even when the app is closed."; btn = `<div><button class="btn" data-act="enablePush">Enable push on this device</button></div>`; }
  return `<div class="card"><h3>📲 Push notifications</h3><div class="muted">${st}</div>${btn}</div>`;
}

/* ---------- app update check (web, APK and EXE all show this) ---------- */
async function checkVersion() {
  try {
    const r = await fetch("/version.json?t=" + Date.now(), { cache: "no-store" });
    const v = await r.json();
    if (v.version && v.version !== APP_VERSION) showUpdate(v); else $("#upd").innerHTML = "";
  } catch (e) { /* offline - ignore */ }
}
function showUpdate(v) {
  const box = $("#upd");
  box.className = v.force ? "force" : "";
  box.innerHTML = `<div class="ub"><div>🔔 <b>New version ${esc(v.version)} is available</b>${v.notes ? `<br><span class="sm">${esc(v.notes)}</span>` : ""}</div>
    <button class="btn" data-act="doUpdate">Update now</button></div>`;
}
async function doUpdate() {
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) { }
  location.replace(location.pathname + "?v=" + Date.now());
}
checkVersion();
setInterval(checkVersion, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });

/* ---------- state ---------- */
const S = { me: null, tab: "mine", view: "list", task: null, parent: null, filter: "All", mem: "All", q: "", pick: null, asec: "users",
  users: [], branches: [], tasks: [], btasks: [], adminTasks: null, usage: null, cur: undefined, subs: [], crumbs: [],
  mode: "login", settingUp: false, ut: null, notifs: [], showN: false, nReady: false, clearedAt: "", pending: new URLSearchParams(location.search).get("task") };
const unsub = {};
const uById = id => S.users.find(u => u.id === id);
const uname = id => uById(id)?.name || "?";
const ulabel = id => { const u = uById(id); return u ? `${u.name} (${u.userId || "admin"})` : "?"; };
const bname = id => S.branches.find(b => b.id === id)?.name || null;
const isAdmin = () => S.me?.role === "admin";
const isMgr = () => S.me?.role === "manager";
const hist = (action, note) => ({ ts: nowIso(), by: S.me.id, byName: S.me.name, action, note: note || "" });
const sortTasks = a => [...a].sort((x, y) => {
  const cx = DONE.includes(x.status) ? 1 : 0, cy = DONE.includes(y.status) ? 1 : 0;
  return cx - cy || (y.createdAt || "").localeCompare(x.createdAt || ""); });

function listen(key, q, cb, onErr) {
  unsub[key]?.();
  unsub[key] = onSnapshot(q, snap => {
    if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites) track("r", Math.max(1, snap.docChanges().length));
    cb(snap);
  }, err => { console.error(key, err); toast("Load error: " + errMsg(err)); onErr?.(err); });
}
function stopListen(...keys) { keys.forEach(k => { unsub[k]?.(); delete unsub[k]; }); }
const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));

/* ---------- session ---------- */
async function boot(u) {
  try {
    const s = await rdoc(doc(db, "users", u.uid));
    if (!s.exists() || s.data().active === false) { toast("Your account is not active. Contact the admin."); await signOut(auth); return; }
    S.me = { id: u.uid, ...s.data() }; S.tab = "mine"; S.view = "list"; S.filter = "All"; S.mem = "All"; S.q = "";
    startSession(); render();
    registerPush(false).then(() => render(true)).catch(() => { });          // silently refresh the push token if already allowed
    if (S.pending) { const id = S.pending; S.pending = null; history.replaceState(null, "", location.pathname); openTask(id); }
  } catch (e) { toast("Cannot load profile: " + errMsg(e)); await signOut(auth); }
}
function startSession() {
  loadNotifs();
  listen("users", collection(db, "users"), snap => {
    S.users = docs(snap).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    const m = uById(S.me.id);
    if (m) { if (m.active === false) { logout("Your account was deactivated"); return; } S.me = m; }
    refresh();
  });
  listen("branches", collection(db, "branches"), snap => { S.branches = docs(snap).sort((a, b) => a.name.localeCompare(b.name)); refresh(); });
  listen("tasks", query(collection(db, "tasks"), where("participants", "array-contains", S.me.id)), snap => { S.tasks = docs(snap); processNotifs(snap); refresh(); });
  clearInterval(S.ut);
  if (isAdmin()) { loadUsage(); S.ut = setInterval(loadUsage, 10 * 60 * 1000); }
}
async function logout(msg) {
  await flushUsage();
  try { const tk = lsGet("tm_tok", null); if (tk) await deleteDoc(doc(db, "devices", tk)); } catch (e) { }   // stop pushes for this user on this device
  Object.keys(unsub).forEach(k => stopListen(k)); clearInterval(S.ut);
  S.me = null; S.users = []; S.tasks = []; S.btasks = []; S.adminTasks = null; S.mode = "login";
  S.notifs = []; S.showN = false; S.nReady = false;
  await signOut(auth); render(); if (msg) toast(msg);
}
onAuthStateChanged(auth, async u => {
  if (S.settingUp) return;
  if (!u) { Object.keys(unsub).forEach(k => stopListen(k)); S.me = null; render(); return; }
  await boot(u);
});

/* ---------- usage (admin) ---------- */
async function loadUsage() {
  try { const s = await rdoc(doc(db, "usage", pacificDay())); S.usage = s.exists() ? s.data() : {}; refresh(); } catch (e) { }
}
const usedOf = k => (S.usage?.[k] || 0) + UC[{ reads: "r", writes: "w", deletes: "d" }[k]];
const usageAlerts = () => Object.keys(LIMITS).filter(k => usedOf(k) / LIMITS[k] >= WARN);

/* ---------- notifications (no extra Firestore reads or writes) ---------- */
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } };
function loadNotifs() { S.notifs = lsGet("tm_n_" + S.me.id, []); S.clearedAt = lsGet("tm_c_" + S.me.id, ""); S.nReady = false; }
function saveNotifs() { S.notifs = S.notifs.slice(0, 40); lsSet("tm_n_" + S.me.id, S.notifs); updBell(); }
const unread = () => S.notifs.filter(n => !n.read).length;
function updBell() {
  const n = unread(), b = $("#nb");
  if (b) { b.textContent = n; b.style.display = n ? "inline-block" : "none"; }
  document.title = (n ? `(${n}) ` : "") + "Task Manager";
}
function candidates(t) {
  const me = S.me.id, out = [], cut = Date.now() - 7 * 864e5;
  if (!(t.participants || []).includes(me)) return out;
  for (const h of t.history || []) {
    if (h.by === me || new Date(h.ts).getTime() < cut || (S.clearedAt && h.ts <= S.clearedAt)) continue;
    let text = null;
    if (h.action === "Created") text = t.assignedTo === me ? `📥 New task from ${h.byName}: ${t.title}` : t.parentId ? `➕ ${h.byName} added a subtask: ${t.title}` : null;
    else if (h.action === "Status → Completed") text = `✅ ${h.byName} completed: ${t.title}`;
    else if (h.action === "Status → Rework" && t.assignedTo === me) text = `↩ Rework requested by ${h.byName}: ${t.title}${h.note ? " – " + h.note : ""}`;
    else if (h.action === "Status → Rejected") text = `⛔ ${h.byName} rejected: ${t.title}`;
    if (text) out.push({ id: `${t.id}|${h.ts}|${h.action}`, ts: h.ts, text, taskId: t.id, read: false });
  }
  return out;
}
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.15, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .35);
    o.start(); o.stop(c.currentTime + .36);
  } catch { }
}
function alertNew(list) {
  beep(); try { navigator.vibrate?.([200, 100, 200]); } catch { }
  toast(list.length > 3 ? `🔔 ${list.length} new updates` : list.map(n => n.text).join("   •   "), 6000);
  if (document.hidden && typeof Notification !== "undefined" && Notification.permission === "granted")
    list.slice(0, 3).forEach(n => { try { new Notification("Task Manager", { body: n.text, tag: n.id }); } catch { } });
}
function processNotifs(snap) {
  const known = new Set(S.notifs.map(n => n.id)), fresh = [];
  snap.docChanges().forEach(c => {
    if (c.type === "removed") return;
    candidates({ id: c.doc.id, ...c.doc.data() }).forEach(n => { if (!known.has(n.id)) { known.add(n.id); fresh.push(n); } });
  });
  const live = S.nReady;
  if (fresh.length) {
    S.notifs = [...fresh, ...S.notifs].sort((a, b) => b.ts.localeCompare(a.ts)); saveNotifs();
    if (live) alertNew(fresh);
  }
  if (!live && !snap.metadata.fromCache) {
    S.nReady = true;
    const u = unread(); if (u) toast(`🔔 You have ${u} unread notification${u > 1 ? "s" : ""}`, 5000);
  }
}
function notifPanel() {
  const items = S.notifs.map(n => `<div class="ni ${n.read ? "" : "un"}" data-act="openN" data-id="${esc(n.taskId)}"><div>${esc(n.text)}</div><div class="sm muted">${fmt(n.ts)}</div></div>`).join("")

}

/* ---------- UI atoms ---------- */
const badge = (t, c) => `<span class="badge" style="background:${c}">${esc(t)}</span>`;
const opt = (v, l, sel) => `<option value="${esc(v)}" ${String(sel) === String(v) ? "selected" : ""}>${esc(l)}</option>`;
const tile = (n, l, c) => `<div class="tile"><b style="color:${c}">${n}</b><span class="muted sm">${l}</span></div>`;

function taskCard(t) {
  const over = t.due && !DONE.includes(t.status) && t.due < todayStr();
  const meta = [badge(t.status, S_COL[t.status] || "#6B7280"), badge(t.priority, P_COL[t.priority] || "#6B7280")];
  if (t.reworkCount) meta.push(badge("Reworked ×" + t.reworkCount, "#9333EA"));
  if (over) meta.push(badge("Overdue", "#B91C1C"));
  if (t.due) meta.push(`<span class="muted sm">Due ${esc(t.due)}</span>`);
  return `<div class="card click" style="border-left:5px solid ${P_COL[t.priority] || "#9CA3AF"}" data-act="open" data-id="${t.id}">
    <div class="title">${t.parentId ? "↳ " : ""}${esc(t.title)}</div>
    <div class="muted sm">👤 ${esc(uname(t.createdBy))} → ${esc(uname(t.assignedTo))}</div>
    <div class="row wrap">${meta.join("")}</div></div>`;
}
const statTiles = rows => `<div class="card"><div class="tiles">${["Pending", "In Progress", "Rework", "Completed"]
  .map(s => tile(rows.filter(r => r.status === s).length, s, S_COL[s])).join("")}</div></div>`;
const filterSel = () => `<select data-chg="filter">${["All", ...STATUSES].map(s => opt(s, s, S.filter)).join("")}</select>`;
const searchBox = () => `<input id="q" data-inp="q" placeholder="🔍 Search title or name…" value="${esc(S.q)}" style="width:100%">`;
const matches = t => { const q = S.q.trim().toLowerCase(); return !q || [t.title, uname(t.createdBy), uname(t.assignedTo)].join(" ").toLowerCase().includes(q); };
const retention = `<div class="muted sm center">Completed tasks are backed up to the admin's email and removed 7 days after completion.</div>`;

/* ---------- views ---------- */

  const hs = [...(t.history || [])].reverse().map(h => `<div class="hist">${fmt(h.ts)} • ${esc(h.byName || uname(h.by))} • ${esc(h.action)}${h.note ? " – " + esc(h.note) : ""}</div>`).join("");

const nextUserId = () => { const n = S.users.map(u => parseInt(u.userId, 10)).filter(x => x >= 1000 && x < 9999); return String(Math.max(1000, ...n) + 1); };

          <button class="btn r s" data-act="delBranch" data-id="${b.id}">Delete</button></div></div>`; }).join("") || `<div class="muted">No branches yet</div>`);
  } else if (sec === "tasks") {
    const rows = S.adminTasks;
    body = `<div class="row"><h3 class="grow">All tasks${rows ? ` (${rows.length}, newest 300)` : ""}</h3><button class="btn o s" data-act="loadAll">${rows ? "Refresh" : "Load"}</button></div>
      <div class="muted sm">Loading costs one read per task, so it only loads when you press the button.</div>` +
      (rows ? rows.map(taskCard).join("") || `<div class="muted">No tasks</div>` : "");
  } else {
    const bars = Object.keys(LIMITS).map(k => { const u = usedOf(k), p = Math.min(100, u / LIMITS[k] * 100), c = p >= 90 ? "#DC2626" : p >= WARN * 100 ? "#F59E0B" : "#16A34A";
      return `<div><div class="row"><b class="grow">${k}</b><span class="muted sm">${u.toLocaleString()} / ${LIMITS[k].toLocaleString()} (${p.toFixed(1)}%)</span></div><div class="bar"><i style="width:${p}%;background:${c}"></i></div></div>`; }).join("");
    body = `<div class="card"><h3>Firebase usage today (estimate)</h3>${bars}
      <div class="muted sm">Counted by this app (resets at midnight Pacific time). The Firebase console shows exact figures. You also get an email at 70% and 90%.</div>

  return `<h2>Admin panel</h2>${tabs}${banner}${body}`;

/* ---------- shell / render ---------- */
function tabsFor() {
  const t = [["mine", "📥", "My Tasks"], ["by", "📤", "Assigned"], ["new", "➕", "New Task"], ["acct", "👤", "Account"]];
  if (isAdmin()) t.push(["admin", "⚙️", "Admin"]); else if (isMgr()) t.push(["branch", "🏢", "Branch"]);
  return t;
}
const viewForTab = k => ({ mine: "list", by: "list", new: "form", acct: "account", admin: "admin", branch: "branch" }[k] || "list");

function capture() {
  const o = {}; document.querySelectorAll("#app input[id],#app select[id],#app textarea[id]").forEach(e => o[e.id] = e.value);
  const a = document.activeElement; o.__f = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null; return o;
}
function restore(o) {
  for (const k in o) { if (k === "__f") continue; const e = document.getElementById(k); if (e && e.value !== o[k]) e.value = o[k]; }
  if (o.__f) { const e = document.getElementById(o.__f.id); if (e) { e.focus(); try { e.setSelectionRange(o.__f.s, o.__f.e); } catch { } } }
}
function render(keep) {
  const saved = keep ? capture() : null, root = $("#app");
  if (!S.me) { root.innerHTML = authView(); return; }
  if ((S.tab === "admin" && !isAdmin()) || (S.tab === "branch" && !isMgr())) { S.tab = "mine"; S.view = "list"; }
  let body;
  switch (S.view) {
    case "detail": body = detailView(); break;
    case "form": body = formView(); break;
    case "account": body = accountView(); break;
    case "admin": body = adminView(); break;
    case "branch": body = branchView(); break;
    default: body = listView(S.tab === "by" ? "by" : "mine");
  }
  const u = S.me, tabs = tabsFor(), on = S.view === "form" && !S.parent ? "new" : S.tab;
  const warn = isAdmin() && usageAlerts().length ? " ⚠️" : "";
  root.innerHTML = `<div class="top"><span style="font-size:20px">✅</span><b>Task Manager</b><span class="grow"></span>
      <span class="who">${esc(u.name)} • ${esc(u.role.toUpperCase())}${bname(u.branchId) ? " • " + esc(bname(u.branchId)) : ""}<br>v${APP_VERSION}</span>
      <button title="Notifications" data-act="bell" style="position:relative">🔔<span id="nb" class="nbadge">0</span></button>
      <button class="av" title="My account" data-act="nav" data-k="acct">${esc((u.name || "?").trim()[0] || "?").toUpperCase()}</button></div>
    <div class="shell"><nav class="nav">${tabs.map(([k, i, l]) => `<button class="${on === k ? "on" : ""}" data-act="nav" data-k="${k}"><span class="ic">${i}</span>${l}${k === "admin" ? warn : ""}</button>`).join("")}</nav>
    <main class="main"><div class="wrap">${body}</div></main></div>${S.showN ? notifPanel() : ""}`;
  if (saved) restore(saved);
  updBell();
}
const refresh = () => { if (S.me && ["list", "detail", "admin", "branch"].includes(S.view)) render(true); };

/* ---------- navigation ---------- */
function leaveDetail() { stopListen("detail", "subs"); S.cur = undefined; S.subs = []; S.crumbs = []; }
function nav(k) {
  leaveDetail();
  S.tab = k; S.view = viewForTab(k); S.parent = null; S.filter = "All"; S.mem = "All"; S.q = ""; S.pick = null;
  if (k !== "branch") stopListen("branch");
  if (k === "branch" && S.me.branchId) {
    S.btasks = [];
    listen("branch", query(collection(db, "tasks"), where("branchIds", "array-contains", S.me.branchId)), snap => { S.btasks = docs(snap); refresh(); });
  }
  if (k === "admin") loadUsage();
  render();
}
function openTask(id) {
  leaveDetail(); S.view = "detail"; S.task = id; S.cur = undefined; render();
  listen("detail", doc(db, "tasks", id), snap => {
    const first = S.cur === undefined;
    S.cur = snap.exists() ? { id: snap.id, ...snap.data() } : null;
    if (first && S.cur?.parentId) loadCrumbs(S.cur.parentId);
    refresh();
  }, () => { S.cur = null; refresh(); });
  const subQ = isAdmin() ? query(collection(db, "tasks"), where("parentId", "==", id))
    : query(collection(db, "tasks"), where("parentId", "==", id), where("participants", "array-contains", S.me.id));
  listen("subs", subQ, snap => { S.subs = docs(snap); refresh(); });
}
async function loadCrumbs(pid) {
  const out = []; let p = pid, n = 0;
  while (p && n < 6) {
    let t = S.tasks.find(x => x.id === p) || S.adminTasks?.find(x => x.id === p) || S.btasks.find(x => x.id === p);
    if (!t) { try { const s = await rdoc(doc(db, "tasks", p)); if (s.exists()) t = { id: s.id, ...s.data() }; } catch { } }
    if (!t) break; out.unshift({ id: t.id, title: t.title }); p = t.parentId; n++;
  }
  S.crumbs = out; refresh();
}

/* ---------- actions ---------- */
const ACT = {
  doUpdate,
  bell() {
    if (S.showN) { S.notifs.forEach(n => n.read = true); saveNotifs(); }
    S.showN = !S.showN; render(true);
  },
  openN(d) { S.notifs.forEach(n => n.read = true); saveNotifs(); S.showN = false; openTask(d.id); },
  clearN() { S.clearedAt = nowIso(); lsSet("tm_c_" + S.me.id, S.clearedAt); S.notifs = []; saveNotifs(); render(true); },
  askPerm() { try { Notification.requestPermission().then(() => render(true)); } catch { } },
  mode: d => { S.mode = d.m; render(); },
  async login() {
    let e = $("#a_email").value.trim(), p = $("#a_pw").value;
    if (!e || !p) return toast("Enter User ID and password");
    if (!e.includes("@")) { if (!/^\d{4}$/.test(e)) return toast("User ID must be 4 digits"); e += ALIAS; }
    try { await signInWithEmailAndPassword(auth, e, p); } catch (x) { toast(errMsg(x)); }
  },
  async forgot() {
    const e = $("#a_email").value.trim();
    if (!e.includes("@")) return toast("Forgot your password? Ask the admin to reset it.");
    try { await sendPasswordResetEmail(auth, e); toast("If this email is registered, a reset link was sent"); } catch (x) { toast(errMsg(x)); }
  },
  async setupGo() {
    const name = $("#a_name").value.trim(), e = $("#a_email").value.trim().toLowerCase(), p = $("#a_pw").value;
    if (!name) return toast("Enter your name");
    if (e !== ADMIN_EMAIL.toLowerCase()) return toast("This email is not the admin email set in config.js");
    if (p.length < MIN_PW) return toast(`Password must be at least ${MIN_PW} characters`);
    S.settingUp = true;
    try {
      const c = await createUserWithEmailAndPassword(auth, e, p);
      await setDoc(doc(db, "users", c.user.uid), { name, nameLower: name.toLowerCase(), userId: "0000", email: e, role: "admin", branchId: null, active: true, created: nowIso() });
      track("w"); S.settingUp = false; await boot(c.user);
    } catch (x) { S.settingUp = false; toast(errMsg(x)); try { await signOut(auth); } catch { } }
  },
  async logout() { if (await ask("Log out of Task Manager?", "Log out")) logout(); },
  async enablePush() {
    try { await registerPush(true); toast("✅ Push notifications enabled"); render(true); } catch (e) { toast(e.message || String(e), 6000); }
  },
  nav: d => nav(d.k),
  open: d => openTask(d.id),
  back() {
    const p = S.cur?.parentId;
    if (p) return openTask(p);
    leaveDetail(); S.view = viewForTab(S.tab); render();
  },
  newSub() { S.parent = S.cur.id; S.pick = null; S.view = "form"; render(); },
  cancelForm() { if (S.parent) { const p = S.parent; S.parent = null; openTask(p); } else nav("mine"); },
  pick(d) { S.pick = d.id; $("#f_sel").innerHTML = chip(S.pick); $("#f_q").value = ""; $("#f_list").innerHTML = ""; },
  unpick() { S.pick = null; $("#f_sel").innerHTML = chip(null); $("#f_q").focus(); fillPickList(); },
  async saveTask() {
    const title = $("#f_title").value.trim(), who = S.pick, due = $("#f_due").value;
    if (!title) return toast("Title is required");
    if (!who) return toast("Search and select a user to assign");
    const btn = $("#saveBtn"); btn.disabled = true;
    const par = S.parent && S.cur?.id === S.parent ? S.cur : null;
    // A subtask is visible to everyone who can see its parent (A -> B -> C: A still sees C's subtask)
    const participants = [...new Set([...(par?.participants || []), S.me.id, who])];
    const branchIds = [...new Set([...(par?.branchIds || []), S.me.branchId, uById(who)?.branchId].filter(Boolean))];
    const data = {
      parentId: S.parent || null, title, description: $("#f_desc").value.trim(), createdBy: S.me.id, assignedTo: who,
      participants, branchIds, status: "Pending", priority: $("#f_pri").value, due: due || "", remarks: "",
      createdAt: nowIso(), updatedAt: nowIso(), completedAt: null, reworkCount: 0, history: [hist("Created", "Assigned to " + uname(who))]
    };
    const ok = await wr(() => addDoc(collection(db, "tasks"), data));
    if (!ok) { btn.disabled = false; return; }
    toast(S.parent ? "Subtask assigned" : "Task assigned");
    if (S.parent) { const p = S.parent; S.parent = null; openTask(p); } else nav("by");
  },
  quick(d) { $("#st").value = d.s; ACT.updateStatus(); },
  async updateStatus() {
    const t = S.cur, ns = $("#st").value, remark = ($("#remark").value || "").trim();
    if (ns === "Rework" && !remark) return toast("Please write the reason for Rework in the remark box");
    if (ns === "Completed" && S.subs.some(s => !DONE.includes(s.status))) return toast("Finish all subtasks before completing this task");
    const upd = {
      status: ns, updatedAt: nowIso(), remarks: remark || t.remarks || "",
      completedAt: ns === "Completed" ? (t.status === "Completed" && t.completedAt ? t.completedAt : nowIso()) : null,
      history: arrayUnion(hist(`Status → ${ns}`, remark))
    };
    if (ns === "Rework" && t.status !== "Rework") upd.reworkCount = increment(1);
    if (await wr(() => updateDoc(doc(db, "tasks", t.id), upd))) { $("#remark").value = ""; toast("Status updated"); }
  },
  async delTask() {
    if (!await ask("Delete this task, its subtasks and history?", "Delete")) return;
    const t = S.cur;
    async function del(id) {
      const q = isAdmin() ? query(collection(db, "tasks"), where("parentId", "==", id))
        : query(collection(db, "tasks"), where("parentId", "==", id), where("participants", "array-contains", S.me.id));
      for (const d of (await rd(q)).docs) await del(d.id);
      track("d"); await deleteDoc(doc(db, "tasks", id));
    }
    try {
      stopListen("detail", "subs"); await del(t.id); toast("Task deleted"); S.cur = undefined;
      if (t.parentId) openTask(t.parentId); else { S.view = viewForTab(S.tab); render(); }
    } catch (e) { toast("Cannot delete (some subtasks belong to others - ask the admin): " + errMsg(e)); openTask(t.id); }
  },
  async changePw() {
    const cur = $("#c_cur").value, nw = $("#c_new").value, con = $("#c_con").value;
    if (nw.length < MIN_PW) return toast(`New password must be at least ${MIN_PW} characters`);
    if (nw !== con) return toast("New passwords do not match");
    try {
      await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, cur));
      await updatePassword(auth.currentUser, nw);
      ["c_cur", "c_new", "c_con"].forEach(i => $("#" + i).value = ""); toast("Password changed");
    } catch (e) { toast(errMsg(e)); }
  },
  asec: d => { S.asec = d.k; if (d.k === "usage") loadUsage(); render(); },
  async createUser() {
    const name = $("#u_name").value.trim().replace(/\s+/g, " "), id = $("#u_id").value.trim(), pw = $("#u_pw").value;
    if (name.length < 2) return toast("Enter the name");
    if (!/^\d{4}$/.test(id)) return toast("User ID must be exactly 4 digits");
    if (pw.length < MIN_PW) return toast(`Password must be at least ${MIN_PW} characters`);
    if (S.users.some(u => (u.name || "").toLowerCase() === name.toLowerCase())) return toast("This name is already used - names must be unique");
    if (S.users.some(u => u.userId === id)) return toast("This User ID is already used");
    try {
      const c = await createUserWithEmailAndPassword(secAuth, id + ALIAS, pw);
      await signOut(secAuth);
      if (await wr(() => setDoc(doc(db, "users", c.user.uid), { name, nameLower: name.toLowerCase(), userId: id, email: id + ALIAS, role: $("#u_role").value, branchId: $("#u_branch").value || null, active: true, created: nowIso() }))) {
        $("#u_name").value = ""; $("#u_pw").value = ""; toast(`User created: ID ${id}`);
      }
    } catch (e) { toast(errMsg(e)); }
  },
  resetHelp(d) {
    const u = uById(d.id);
    ask(`Reset password for ${u.name} (ID ${u.userId}):\n\n1. Open your GitHub repository > Actions\n2. Task Manager maintenance > Run workflow\n3. mode: resetpw   user id: ${u.userId}   new password: (6+ characters)\n4. Run it, then give the user the new password.`, "OK", false);
  },
  async toggleActive(d) {
    const u = uById(d.id); const act = u.active === false;
    if (!act && !await ask(`Deactivate ${u.name}? They will no longer be able to log in.`, "Deactivate")) return;
    if (await wr(() => updateDoc(doc(db, "users", u.id), { active: act }))) toast(act ? "User activated" : "User deactivated");
  },
  async createBranch() {
    const n = $("#b_name").value.trim();
    if (n.length < 2) return toast("Enter the branch name");
    if (S.branches.some(b => b.name.toLowerCase() === n.toLowerCase())) return toast("This branch already exists");
    if (await wr(() => addDoc(collection(db, "branches"), { name: n, created: nowIso() }))) { $("#b_name").value = ""; toast("Branch created"); }
  },
  async delBranch(d) {
    const b = S.branches.find(x => x.id === d.id);
    if (!await ask(`Delete branch '${b.name}'? Users stay but become unassigned.`, "Delete")) return;
    const members = S.users.filter(u => u.branchId === b.id);
    await wr(async () => { const bt = writeBatch(db); members.forEach(u => bt.update(doc(db, "users", u.id), { branchId: null })); bt.delete(doc(db, "branches", b.id)); await bt.commit(); }, members.length + 1);
  },
  async loadAll() {
    try { S.adminTasks = docs(await rd(query(collection(db, "tasks"), orderBy("createdAt", "desc"), limit(300)))); render(); } catch (e) { toast(errMsg(e)); }
  },
  refreshUsage: () => loadUsage()
};
const CHG = {
  filter: v => { S.filter = v; render(); },
  mem: v => { S.mem = v; render(); },
  setRole: (v, d) => wr(() => updateDoc(doc(db, "users", d.id), { role: v })),
  setBranch: (v, d) => wr(() => updateDoc(doc(db, "users", d.id), { branchId: v || null }))
};
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t) ACT[t.dataset.act]?.(t.dataset, t); });
document.addEventListener("change", e => { const t = e.target.closest("[data-chg]"); if (t) CHG[t.dataset.chg]?.(t.value, t.dataset); });
document.addEventListener("input", e => {
  const k = e.target.dataset?.inp;
  if (k === "q") { S.q = e.target.value; render(true); }
  if (k === "pick") fillPickList();
});
document.addEventListener("focusin", e => { if (e.target.id === "f_q") fillPickList(); });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !S.me && e.target.tagName === "INPUT") (S.mode === "setup" ? ACT.setupGo : ACT.login)();
});
</script>
</body>
</html>
